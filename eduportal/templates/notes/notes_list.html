{% extends 'base.html' %}
{% block title %}{{ chapter.title }} - Notes{% endblock %}
{% block content %}
<span class="eyebrow">Notes</span>
<h1>{{ chapter.title }}</h1>
<div class="list">
    {% for note in notes %}
    <div class="list-item">
        <span>📄 {{ note.title }}</span>
        <a href="{{ note.pdf_file.url }}" download class="btn-small">Download PDF</a>
    </div>
    {% empty %}
    <p>No notes uploaded yet for this chapter.</p>
    {% endfor %}
</div>
{% endblock %}
