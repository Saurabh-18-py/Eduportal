{% extends 'base.html' %}
{% block title %}{{ page_title }}{% endblock %}
{% block content %}
<span class="eyebrow">Notes</span>
<h1>{{ page_title }}</h1>

<div class="pdf-toolbar">
    <a href="{{ back_url }}" class="btn-small btn-ghost">&larr; Back</a>
    <a href="{{ download_url }}" class="btn-small" download>Download</a>
    <a href="{{ pdf_url }}" target="_blank" rel="noopener" class="btn-small btn-ghost">Open in New Tab</a>
</div>

<div class="pdf-embed-wrap">
    <iframe src="{{ pdf_url }}" class="pdf-embed" title="{{ page_title }}"></iframe>
</div>
<p class="empty-note pdf-fallback-note">
    PDF not loading above? Use "Open in New Tab" or "Download" instead.
</p>
{% endblock %}
